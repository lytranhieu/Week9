name: Bai 05 - JaCoCo Coverage >= 80%

on:
  push:
    paths:
      - 'Bai05/**'
      - '.github/workflows/bai05-coverage.yml'
  pull_request:
    paths:
      - 'Bai05/**'
      - '.github/workflows/bai05-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Build, test, coverage gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Bai05

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Maven Verify with JaCoCo
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bai05-jacoco-html
          path: Bai05/target/site/jacoco/
          if-no-files-found: warn

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bai05-surefire-reports
          path: Bai05/target/surefire-reports/
          if-no-files-found: warn
