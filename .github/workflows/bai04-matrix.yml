name: Bai 04 - Matrix OS Test

on:
  push:
    paths:
      - 'Bai04/**'
      - '.github/workflows/bai04-matrix.yml'
  pull_request:
    paths:
      - 'Bai04/**'
      - '.github/workflows/bai04-matrix.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: Bai04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Test and package with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify
